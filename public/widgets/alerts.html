<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coffee Bot - Alert Box (OBS)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alert-card {
      display: flex;
      align-items: center;
      gap: 22px;
      background: rgba(18, 14, 12, 0.96);
      border: 3px solid #f59e0b;
      border-radius: 24px;
      padding: 22px 38px;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.45), inset 0 0 25px rgba(245, 158, 11, 0.15);
      backdrop-filter: blur(14px);
      min-width: 440px;
      max-width: 700px;
      color: #fff;
      opacity: 0;
      transform: translateY(40px) scale(0.9);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      position: relative;
    }

    .alert-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Distinct themes per event type */
    .alert-card.theme-follow {
      border-color: #10b981;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.5), inset 0 0 25px rgba(16, 185, 129, 0.2);
    }
    .alert-card.theme-follow .alert-icon {
      background: linear-gradient(135deg, #10b981, #065f46);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
    }
    .alert-card.theme-follow .alert-title {
      color: #34d399;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
    }

    .alert-card.theme-donate {
      border-color: #eab308;
      box-shadow: 0 0 50px rgba(234, 179, 8, 0.55), inset 0 0 30px rgba(234, 179, 8, 0.25);
    }
    .alert-card.theme-donate .alert-icon {
      background: linear-gradient(135deg, #eab308, #854d0e);
      box-shadow: 0 0 30px rgba(234, 179, 8, 0.8);
    }
    .alert-card.theme-donate .alert-title {
      color: #fde047;
      text-shadow: 0 0 12px rgba(253, 224, 71, 0.9);
    }

    .alert-card.theme-gift {
      border-color: #ec4899;
      box-shadow: 0 0 50px rgba(236, 72, 153, 0.5), inset 0 0 25px rgba(236, 72, 153, 0.2);
    }
    .alert-card.theme-gift .alert-icon {
      background: linear-gradient(135deg, #ec4899, #9d174d);
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
    }
    .alert-card.theme-gift .alert-title {
      color: #f472b6;
      text-shadow: 0 0 10px rgba(244, 114, 182, 0.8);
    }

    .alert-card.theme-sub {
      border-color: #8b5cf6;
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.55), inset 0 0 30px rgba(139, 92, 246, 0.25);
    }
    .alert-card.theme-sub .alert-icon {
      background: linear-gradient(135deg, #8b5cf6, #5b21b6);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
    }
    .alert-card.theme-sub .alert-title {
      color: #c4b5fd;
      text-shadow: 0 0 12px rgba(196, 181, 253, 0.9);
    }

    .alert-card.theme-milestone, .alert-card.theme-rain {
      border-color: #f97316;
      box-shadow: 0 0 60px rgba(249, 115, 22, 0.65), inset 0 0 35px rgba(249, 115, 22, 0.3);
      animation: pulseBorder 1.2s infinite alternate;
    }
    .alert-card.theme-milestone .alert-icon, .alert-card.theme-rain .alert-icon {
      background: linear-gradient(135deg, #f97316, #9a3412);
      box-shadow: 0 0 35px rgba(249, 115, 22, 0.9);
    }
    .alert-card.theme-milestone .alert-title, .alert-card.theme-rain .alert-title {
      color: #fdba74;
      text-shadow: 0 0 14px rgba(253, 186, 116, 0.95);
    }

    @keyframes pulseBorder {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.02); filter: brightness(1.15); }
    }

    .alert-icon {
      font-size: 52px;
      width: 86px;
      height: 86px;
      background: linear-gradient(135deg, #d97706, #78350f);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(217, 119, 6, 0.6);
      animation: pulseIcon 1.4s infinite alternate;
      flex-shrink: 0;
    }

    @keyframes pulseIcon {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); filter: brightness(1.25); }
    }

    .alert-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .alert-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
    }

    .alert-message {
      font-size: 21px;
      font-weight: 700;
      color: #fef3c7;
      line-height: 1.35;
      word-break: break-word;
    }

    .coffee-steam-bar {
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #f59e0b, #ef4444, transparent);
      border-radius: 2px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="alert-card" id="alertCard">
    <div class="alert-icon" id="alertIcon">☕</div>
    <div class="alert-content">
      <div class="alert-title" id="alertTitle">Alerta do Coffee Bot</div>
      <div class="alert-message" id="alertMessage">Mensagem do alerta ao vivo!</div>
    </div>
    <div class="coffee-steam-bar"></div>
  </div>

  <script src="/js/audio-synth.js"></script>
  <script>
    const alertCard = document.getElementById('alertCard');
    const alertIcon = document.getElementById('alertIcon');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');

    const queue = [];
    let isShowing = false;

    function processQueue() {
      if (queue.length === 0 || isShowing) return;

      const item = queue.shift();
      isShowing = true;

      const type = (item.type || 'coffee').toLowerCase();

      // Reset theme classes
      alertCard.className = 'alert-card';
      if (type === 'follow') {
        alertCard.classList.add('theme-follow');
      } else if (type === 'donate' || type === 'superchat' || type === 'bits') {
        alertCard.classList.add('theme-donate');
      } else if (type === 'gift') {
        alertCard.classList.add('theme-gift');
      } else if (type === 'sub' || type === 'member' || type === 'fan_club') {
        alertCard.classList.add('theme-sub');
      } else if (type === 'milestone' || type === 'like_goal') {
        alertCard.classList.add('theme-milestone');
      } else if (type === 'rain') {
        alertCard.classList.add('theme-rain');
      }

      alertIcon.textContent = item.icon || (type === 'follow' ? '🌟' : type === 'gift' ? '🎁' : type === 'donate' ? '💰' : type === 'sub' ? '⭐' : '☕');
      alertTitle.textContent = item.title || 'ALERTA DO COFFEE BOT';
      alertMessage.textContent = item.message || '';

      alertCard.classList.add('show');

      // Play the distinct coffee audio synthesizer
      if (window.SoundFX) {
        window.SoundFX.playEventSound(type);
      }

      // Hide after duration
      const duration = item.duration || (type === 'milestone' || type === 'rain' ? 7000 : 5000);
      setTimeout(() => {
        alertCard.classList.remove('show');
        setTimeout(() => {
          isShowing = false;
          processQueue();
        }, 600);
      }, duration);
    }

    function pushAlert(item) {
      queue.push(item);
      processQueue();
    }

    // Connect to WebSocket
    function connectWS() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload.type === 'alert') {
            pushAlert(payload.data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, 3000);
      };
    }

    connectWS();
  </script>
</body>
</html>
